<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gillbert - Fish of Fame</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./assets/theme.css" />
  <link rel="stylesheet" href="./assets/base.css" />
  <link rel="stylesheet" href="./assets/topbar.css" />
  <script src="./assets/settings.js"></script>
  <script src="./assets/season.js"></script>
  <link rel="stylesheet" href="./assets/fish-of-fame.css" />
</head>
<body class="layout-open">
  <div class="container">
    <header class="topbar" id="topbar"></header>
    <script src="./assets/topbar.js"></script>

    <div class="page-head">
      <span class="page-head-tile" aria-hidden="true">🏆</span>
      <div>
        <p class="page-head-label">Catches</p>
        <h1>Fish of Fame</h1>
      </div>
    </div>

    <p class="page-intro">Biggest catches, species records, top anglers, all logged here. Our shack wall just went digital, and this one's coming with us wherever we go.</p>

    <div id="status" class="status"></div>
    <div id="loadingIndicator" class="loading-indicator">
      <div class="fishing-animation">
        🎣<span class="bobber">●</span>
      </div>
      <p>Loading the leaderboards...</p>
    </div>

    <div id="content" class="hidden">
      <div class="group-filter hidden" id="groupFilter"></div>

      <div class="leaderboard-section">
        <div class="section-divider"><span class="section-label">📏 Biggest Catches</span></div>
        <div id="topCatchesList" class="leaderboard-list"></div>
      </div>

      <div class="leaderboard-section">
        <div class="section-divider"><span class="section-label">🐟 Fish Species Records</span></div>
        <div id="fishSpeciesRecordsList" class="leaderboard-list"></div>
      </div>

      <div class="leaderboard-section">
        <div class="section-divider"><span class="section-label">👤 Top Anglers</span></div>
        <div id="topAnglersList" class="leaderboard-list"></div>
      </div>
    </div>
    <br />
  </div>

  <script src="./assets/config.js"></script>
  <script src="./assets/fish-of-fame.js"></script>
  <script src="./assets/admin.js"></script>
</body>
</html>
