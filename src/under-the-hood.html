<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Under the Hood · Gillbert</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./assets/theme.css" />
  <link rel="stylesheet" href="./assets/base.css" />
  <link rel="stylesheet" href="./assets/topbar.css" />
  <script src="./assets/settings.js"></script>
  <script src="./assets/season.js"></script>
  <link rel="stylesheet" href="./assets/under-the-hood.css" />
</head>
<body class="layout-card">
  <!-- Admin-only and deliberately not linked from any menu: reached by typing the URL. -->
  <header class="topbar" id="topbar"></header>
  <script src="./assets/topbar.js"></script>
  <div class="page-head">
    <span class="page-head-tile" aria-hidden="true">🔧</span>
    <div>
      <p class="page-head-label">Admin</p>
      <h1>Under the Hood</h1>
    </div>
  </div>
  <div class="container">
    <p class="page-intro">Which environment, server, database and code you're on right now.</p>

    <!-- ── Loading state ────────────────────────────────────────────── -->
    <div id="loadingState">
      <div class="loading-indicator">
        <div class="fishing-animation">🎣<span class="bobber">●</span></div>
        <p>Asking the server about itself…</p>
      </div>
    </div>

    <!-- ── Error state ──────────────────────────────────────────────── -->
    <div id="errorState" class="hidden">
      <div class="error-card">
        <p class="error-icon">⚠️</p>
        <p id="errorMsg">Unable to reach the server.</p>
        <button id="retryBtn" class="primary-button">🔄 Try Again</button>
      </div>
    </div>

    <!-- ── Server switch: admins, or any device currently on Bridge01 ─ -->

    <!-- ── Verdict (shown with or without a server answer) ──────────── -->
    <div id="verdict" class="verdict hidden"></div>

    <!-- ── Details ──────────────────────────────────────────────────── -->
    <div id="detailsState" class="hidden">
      <section class="info-card">
        <h2>✅ Checks</h2>
        <dl id="checksList"></dl>
      </section>

      <section class="info-card">
        <h2>🌐 This Site</h2>
        <dl id="siteList"></dl>
      </section>

      <section class="info-card" id="serverInfoCard">
        <h2>⚙️ Server</h2>
        <dl id="serverList"></dl>
      </section>

      <section class="info-card" id="databaseCard">
        <h2>🗄️ Database</h2>
        <dl id="databaseList"></dl>
      </section>

      <section class="info-card">
        <h2>🪪 Raw Identity Response</h2>
        <pre id="rawIdentity">—</pre>
      </section>

      <button id="refreshBtn" class="primary-button">🔄 Check Again</button>
    </div>
  </div>

  <script src="./assets/config.js"></script>
  <script src="./assets/version.js"></script>
  <script src="./assets/admin.js"></script>
  <script src="./assets/under-the-hood.js"></script>
</body>
</html>
