<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gillbert - Catch Details</title>
  <link rel="stylesheet" href="./assets/catch-details.css" />
  <link rel="stylesheet" href="./assets/top-home-link.css" />
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="./index.html" class="top-home-link" aria-label="Go back to Home">← Home</a>
    </div>

    <div id="status" class="status"></div>

    <div id="loadingIndicator" class="loading-indicator">
      <div class="fishing-animation">
        🎣<span class="bobber">●</span>
      </div>
      <p>Loading catch details...</p>
    </div>

    <div id="detailsContainer"></div>

    <!-- Record Info Modal -->
    <div id="recordInfoModal" class="ri-modal" role="dialog" aria-modal="true" aria-label="Record Info">
      <div class="ri-modal-sheet">
        <div class="ri-modal-header">
          <span class="ri-modal-title">🗂️ Record Info</span>
          <button class="ri-modal-close" id="recordInfoClose" aria-label="Close">&times;</button>
        </div>
        <div class="ri-modal-body" id="recordInfoBody"></div>
      </div>
    </div>

    <!-- Delete Media Confirmation Modal -->
    <div id="deleteMediaModal" class="dm-modal" role="dialog" aria-modal="true" aria-label="Delete Media">
      <div class="dm-modal-sheet">
        <div class="dm-modal-header">
          <span class="dm-modal-title">🗑️ Delete Media</span>
          <button class="dm-modal-close" id="deleteMediaClose" aria-label="Close">&times;</button>
        </div>
        <div class="dm-modal-body">
          <div id="deleteMediaPreview" class="dm-preview"></div>
          <div id="deleteMediaInfo" class="dm-info"></div>
          <p class="dm-warning">⚠️ This permanently removes the file from storage and cannot be undone.</p>
        </div>
        <div class="dm-modal-footer">
          <button id="deleteMediaCancel" class="dm-btn dm-btn--cancel">Cancel</button>
          <button id="deleteMediaConfirm" class="dm-btn dm-btn--delete">Delete</button>
        </div>
      </div>
    </div>

    <!-- Lightbox overlay -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Full size image">
      <button id="lightboxClose" class="lightbox-close" aria-label="Close">&times;</button>
      <img id="lightboxImg" class="lightbox-img" src="" alt="Full size catch photo" />
    </div>

    <a href="./catches-listing.html" id="backButton" class="back-button">← Back to Listing</a>
  </div>

  <script src="./assets/config.js"></script>
  <script src="./assets/admin.js"></script>
  <script src="./assets/catch-details.js"></script>
</body>
</html>
