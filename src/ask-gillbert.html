<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Gillbert</title>
  <link rel="stylesheet" href="./assets/ask-gillbert.css" />
  <style>
    .message-bubble p { margin: 0 0 8px; }
    .message-bubble p:last-child { margin-bottom: 0; }
    .message-bubble ul,
    .message-bubble ol { margin: 4px 0 8px; padding-left: 20px; }
    .message-bubble hr { border: none; border-top: 1px solid #e0e0e0; margin: 8px 0; }
    .message-bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 14px; }
    .message-bubble th,
    .message-bubble td { border: 1px solid #e0e0e0; padding: 6px 10px; text-align: left; }
    .message-bubble th { background: #f5f5f5; font-weight: 700; }
  </style>
</head>
<body>
  <div class="chat-page">

    <div class="chat-header">
      <a href="./index.html" class="chat-header-back" aria-label="Back to home">←</a>
      <div class="chat-header-info">
        <div class="chat-header-title">🔍 Ask Gillbert</div>
        <div class="chat-header-subtitle">Ask anything about the catch records</div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="chat-welcome" id="chatWelcome">
        <span class="chat-welcome-icon">🎣</span>
        <p>Hey! I've got the full catch record book loaded up.<br>Ask me anything — totals, records, who's catching what, when, where — whatever you want to know!</p>
      </div>
    </div>

    <div class="chat-input-bar">
      <textarea
        id="chatInput"
        class="chat-input"
        placeholder="Ask about the records…"
        rows="1"
        maxlength="2000"
        aria-label="Ask Gillbert"
      ></textarea>
      <button id="chatSendBtn" class="chat-send-btn" aria-label="Send message">
        <svg class="chat-send-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3.4 20.6 21.8 12 3.4 3.4l2.1 7.1 8.4 1.5-8.4 1.5z" fill="currentColor"/>
        </svg>
      </button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="./assets/config.js"></script>
  <script src="./assets/ask-gillbert.js"></script>
</body>
</html>
