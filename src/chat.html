<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat with Gillbert</title>
  <link rel="stylesheet" href="./assets/chat.css" />
</head>
<body>
  <div class="chat-page">

    <div class="chat-header">
      <a href="./index.html" class="chat-header-back" aria-label="Back to home">←</a>
      <div class="chat-header-info">
        <div class="chat-header-title">💬 Chat with Gillbert</div>
        <div class="chat-header-subtitle">Your AI fishing companion</div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="chat-welcome" id="chatWelcome">
        <span class="chat-welcome-icon">🎣</span>
        <p>Hey there! I'm Gillbert — your AI fishing companion.<br>Tell me about a catch and I'll log it, or ask me anything!</p>
      </div>
    </div>

    <div class="chat-input-bar">
      <textarea
        id="chatInput"
        class="chat-input"
        placeholder="Tell me about a catch…"
        rows="1"
        maxlength="2000"
        aria-label="Message Gillbert"
      ></textarea>
      <button id="chatSendBtn" class="chat-send-btn" aria-label="Send message">↑</button>
    </div>

  </div>

  <script src="./assets/config.js"></script>
  <script src="./assets/chat.js"></script>
</body>
</html>
