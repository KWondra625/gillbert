<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gear · Gillbert</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./assets/theme.css" />
  <link rel="stylesheet" href="./assets/base.css" />
  <link rel="stylesheet" href="./assets/topbar.css" />
  <script src="./assets/settings.js"></script>
  <script src="./assets/season.js"></script>
  <link rel="stylesheet" href="./assets/gear.css" />
</head>
<body class="layout-open">
  <div class="container">
    <header class="topbar" id="topbar"></header>
    <script src="./assets/topbar.js"></script>

    <div class="page-head">
      <span class="page-head-tile" aria-hidden="true">🚩</span>
      <div>
        <p class="page-head-label">The crew</p>
        <h1>Gear</h1>
      </div>
    </div>

    <div id="loadingState">
      <div class="loading-indicator">
        <div class="fishing-animation">🎣<span class="bobber">●</span></div>
        <p>Loading gear…</p>
      </div>
    </div>

    <div id="errorState" class="hidden">
      <div class="error-card">
        <p class="error-icon">⚠️</p>
        <p id="errorMsg">Unable to load gear. Please check your connection and try again.</p>
        <button id="retryBtn" class="primary-button">🔄 Try Again</button>
      </div>
    </div>

    <div id="listState" class="hidden">
      <p class="gear-intro">Everyone's tip-ups. Tap one to see or change its setup.</p>

      <section class="gear-section" aria-labelledby="activeHead">
        <h2 class="gear-section-head" id="activeHead">
          <span>Tip-ups · <span id="activeCount">0</span></span>
          <a href="./gear-edit.html" class="secondary-button button-small button-raised" id="addBtn">＋ Add a tip-up</a>
        </h2>
        <ul class="gear-list" id="activeList"></ul>
        <p class="gear-empty hidden" id="activeEmpty">No tip-ups yet. Add the first one, and its setup after.</p>
      </section>

      <section class="gear-section hidden" id="retiredSection" aria-labelledby="retiredHead">
        <h2 class="gear-section-head" id="retiredHead"><span>Retired · <span id="retiredCount">0</span></span></h2>
        <ul class="gear-list" id="retiredList"></ul>
      </section>
    </div>
  </div>

  <script src="./assets/config.js"></script>
  <script src="./assets/admin.js"></script>
  <script src="./assets/gear-common.js"></script>
  <script src="./assets/gear.js"></script>
</body>
</html>
